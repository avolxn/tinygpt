name: tinygpt-vllm

services:
  vllm:
    image: vllm/vllm-openai:${VLLM_IMAGE_TAG:-latest}
    command:
      - ${VLLM_MODEL:?Set VLLM_MODEL in infra/vllm/.env}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --api-key
      - ${VLLM_API_KEY:?Set VLLM_API_KEY in infra/vllm/.env}
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "8000:8000"
    volumes:
      - huggingface-cache:/root/.cache/huggingface
      - vllm-cache:/root/.cache/vllm
    ipc: host
    gpus: all
    restart: unless-stopped

volumes:
  huggingface-cache:
  vllm-cache:
