name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/airflow/compose.yaml config --quiet
      - run: docker compose -f infra/airflow/compose.yaml up --build --wait --wait-timeout 300
      - run: |
          curl --fail --retry 12 --retry-delay 5 --retry-all-errors http://localhost:8081/api/v2/monitor/health
          curl --fail http://localhost:5000/version
          docker compose -f infra/airflow/compose.yaml exec -T airflow airflow dags list-import-errors --output json | jq -e 'length == 0'
          docker compose -f infra/airflow/compose.yaml exec -T airflow /opt/tinygpt/.venv/bin/python -c 'import mlflow; mlflow.set_experiment("ci"); mlflow.start_run(); mlflow.log_metric("health", 1); mlflow.end_run()'
      - if: failure()
        run: docker compose -f infra/airflow/compose.yaml logs --tail 100
      - if: always()
        run: docker compose -f infra/airflow/compose.yaml down --volumes
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra cpu --group dev
      - run: uv run --no-sync ruff check src scripts tasks tests infra/airflow/dags
      - run: uv run --no-sync ruff format --check src scripts tasks tests infra/airflow/dags
      - run: uv run --no-sync mypy src scripts tasks infra/airflow/dags
      - run: docker pull python:3.12-slim
      - run: uv run --no-sync pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
