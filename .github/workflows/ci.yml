name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-postgres
      AIRFLOW_JWT_SECRET: ci-airflow-jwt-secret
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/airflow/compose.yaml config --quiet
      - run: docker compose -f infra/airflow/compose.yaml up --build --wait --wait-timeout 300
      - run: |
          curl --fail --retry 12 --retry-delay 5 --retry-all-errors http://localhost:8081/api/v2/monitor/health
          curl --fail http://localhost:5000/version
          docker compose -f infra/airflow/compose.yaml exec -T airflow airflow dags list-import-errors --output json | jq -e 'length == 0'
          docker compose -f infra/airflow/compose.yaml exec -T airflow /opt/tinygpt/.venv/bin/python -c 'import mlflow; mlflow.set_experiment("ci"); mlflow.start_run(); mlflow.log_metric("health", 1); mlflow.end_run()'
      - if: failure()
        run: docker compose -f infra/airflow/compose.yaml logs --tail 100
      - if: always()
        run: docker compose -f infra/airflow/compose.yaml down --volumes
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
      - run: uv sync --frozen --extra cpu --group dev
      - run: uv run --extra cpu ruff check src scripts tasks tests infra/airflow/dags

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
      - run: uv sync --frozen --extra cpu --group dev
      - run: uv run --extra cpu ruff format --check src scripts tasks tests infra/airflow/dags

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
      - run: uv sync --frozen --extra cpu --group dev
      - run: uv run --extra cpu mypy src/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-3.12-${{ hashFiles('**/uv.lock') }}
      - run: uv sync --frozen --extra cpu --group dev
      - run: docker pull python:3.12-slim
      - run: uv run --extra cpu pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
